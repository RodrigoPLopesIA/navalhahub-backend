
spring:
  application:
    name: navalhahub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/navalhahub}
    username: ${DB_USERNAME:postgres}
    password: ""
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/navalha-hub-realm}

server:
  port: 8081

webhook:
  username: webhook
  password: webhook
logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG