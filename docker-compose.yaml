
services:
  navalhahub_database:
    image: postgres:17-alpine
    container_name: navalhahub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: navalhahub
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - sh
      - -c
      - |
        if [ -f "$$PGDATA/pg_hba.conf" ]; then
          sed -i -E '/^[[:space:]]*host[[:space:]]/s/[[:space:]]+(scram-sha-256|md5)[[:space:]]*$$/ trust/' "$$PGDATA/pg_hba.conf"
        fi
        exec docker-entrypoint.sh postgres
    ports:
      - "5432:5432"
    volumes:
      - navalhahub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d navalhahub"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak_database:
    image: postgres:17-alpine
    container_name: navalhahub_keycloak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: dev_keycloak_123
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: navalhahub_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak_database
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: dev_keycloak_123
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      keycloak_database:
        condition: service_healthy

volumes:
  navalhahub_postgres_data:
  keycloak_postgres_data:
